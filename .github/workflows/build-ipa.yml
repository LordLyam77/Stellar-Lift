name: Build Stellar Lift IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version

      - name: Build and Package .ipa
        run: |
          set -e
          mkdir -p build/Payload

          xcodebuild build \
            -project StellarLift.xcodeproj \
            -scheme StellarLift \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            CONFIGURATION_BUILD_DIR=build/Release-iphoneos

          cp -r build/Release-iphoneos/StellarLift.app build/Payload/
          cd build
          zip -qr StellarLift.ipa Payload
          cd ..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StellarLift-IPA
          path: build/StellarLift.ipa
          retention-days: 14
