name: Build Stellar Lift IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version

      - name: Build Application (Ad-Hoc Signed for Sideloading)
        run: |
          set -eo pipefail
          mkdir -p build
          xcodebuild build \
            -project StellarLift.xcodeproj \
            -scheme StellarLift \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            CONFIGURATION_BUILD_DIR="$PWD/build/Release-iphoneos" 2>&1 | tee build/xcodebuild.log

      - name: Package .ipa
        run: |
          set -e
          APP_PATH=$(find build -name "StellarLift.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: StellarLift.app not found in build directory!"
            find build -maxdepth 3
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          mkdir -p build/Payload
          cp -r "$APP_PATH" build/Payload/
          cd build
          zip -qr StellarLift.ipa Payload
          cd ..
          echo "IPA packaged successfully:"
          ls -lh build/StellarLift.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StellarLift-IPA
          path: build/StellarLift.ipa
          retention-days: 14

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Xcodebuild-Log
          path: build/xcodebuild.log
          retention-days: 7
