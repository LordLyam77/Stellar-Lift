name: Build Stellar Lift IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Build Archive (Unsigned / Ad-Hoc for Sideloading)
        run: |
          xcodebuild archive \
            -project StellarLift.xcodeproj \
            -scheme StellarLift \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/StellarLift.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package .ipa
        run: |
          mkdir -p build/Payload
          cp -r build/StellarLift.xcarchive/Products/Applications/StellarLift.app build/Payload/
          cd build
          zip -r StellarLift.ipa Payload
          cd ..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StellarLift-IPA
          path: build/StellarLift.ipa
          retention-days: 14
